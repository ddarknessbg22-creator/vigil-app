name: Build VIGIL APK
on:
  push:
    branches: [main, v0/discipline-companion]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vigil-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "vigil-${GITHUB_REF_NAME}-debug.apk"
          gh release create "$GITHUB_REF_NAME" "vigil-${GITHUB_REF_NAME}-debug.apk" --prerelease --title "VIGIL ${GITHUB_REF_NAME}" --notes "Debug-signed APK. Enable install from unknown sources to sideload."
