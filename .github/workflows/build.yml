name: Build VIGIL APK
on:
  push:
    branches: [main, v0/discipline-companion]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Release build: R8 + resource shrinking + no debug overhead.
      - run: ./gradlew :app:testDebugUnitTest :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: vigil-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "vigil-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "vigil-${GITHUB_REF_NAME}.apk" --title "VIGIL ${GITHUB_REF_NAME}" --notes "Release notes and features are listed in the source commits."
