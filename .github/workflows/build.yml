name: Build VIGIL APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install Gradle
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 8.7
          sdk default gradle 8.7
          gradle --version

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo 24333f8a63b6825ea9c5514f83c2829b004d1fee > $ANDROID_HOME/licenses/android-sdk-license

      - name: Install Android SDK components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-35" "build-tools;34.0.0" 2>&1 || true

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > VigilApp/local.properties
          cat VigilApp/local.properties

      - name: Build Debug APK with Gradle
        run: |
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          cd VigilApp
          gradle :app:assembleDebug \
            --no-daemon \
            -Dorg.gradle.jvmargs=-Xmx2g \
            -Dorg.gradle.workers.max=2 \
            -Dorg.gradle.native=false \
            --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vigil-debug-apk
          path: VigilApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
        if: always()
