name: Build VIGIL APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Find Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          ls -la /usr/lib/android-sdk/ 2>&1 | head -5 || echo "/usr/lib/android-sdk not found"
          ls -la $HOME/android-sdk/ 2>&1 | head -5 || echo "$HOME/android-sdk not found"

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/lib/android-sdk}"
          mkdir -p "$SDK_DIR/licenses"
          echo 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$SDK_DIR/licenses/android-sdk-license"

      - name: Install Android SDK components
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/lib/android-sdk}"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" "platforms;android-35" "build-tools;34.0.0" 2>&1 || true

      - name: Configure local.properties
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/lib/android-sdk}"
          echo "sdk.dir=$SDK_DIR" > VigilApp/local.properties
          cat VigilApp/local.properties

      - name: Build Debug APK with Gradle
        run: |
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          cd VigilApp
          gradle :app:assembleDebug \
            --no-daemon \
            -Dorg.gradle.jvmargs=-Xmx2g \
            -Dorg.gradle.workers.max=2 \
            -Dorg.gradle.native=false \
            --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vigil-debug-apk
          path: VigilApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
        if: always()
